  <!-- FORMULARIO DE PRESUPUESTO -->
  <main>
    <section class="formulario">
      <h2>Solicita tu presupuesto</h2>
      <form action="gracias.html" method="get">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required pattern="[A-Za-zÁÉÍÓÚÑáéíóúñ ]{2,}">

        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" name="email" required>

        <label for="telefono">Teléfono:</label>
        <input type="tel" id="telefono" name="telefono" required pattern="[0-9]{9}">

        <label for="mensaje">Solicite más información:</label>
        <textarea id="mensaje" name="mensaje" rows="4" required></textarea>

        <div class="checkbox">
          <input type="checkbox" id="privacidad" required>
          <label for="privacidad">Acepto la política de privacidad</label>
        </div>

        <button type="submit">Enviar solicitud</button>
      </form>
    </section>
  </main>
